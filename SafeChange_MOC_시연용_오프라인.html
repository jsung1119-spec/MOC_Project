<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SafeChange · PSM 변경요소관리</title>
  <style>
    :root{--navy:#073b67;--blue:#0669b6;--ink:#172434;--muted:#687888;--line:#dce4ea;--bg:#f7f9f8;--card:#fff;--teal:#0b9b93;--green:#228565;--amber:#d68a11;--red:#c74747;--purple:#7353b6}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"맑은 고딕","Malgun Gothic",Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.hidden{display:none!important}
    .entry{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(125deg,#e8f3f8 0%,#f7f9f8 48%,#dcecf3 100%)}.entry-card{width:min(100%,650px);padding:52px;border-left:6px solid var(--blue);background:#ffffffd9;box-shadow:0 18px 60px #0b365222}.ci{font-size:30px;line-height:1;font-weight:900;color:#075a94;letter-spacing:-2px}.ci small{display:block;margin-top:8px;font-size:10px;letter-spacing:2px;color:#5f8198}.entry h1,.page-title h1{font-family:"HY헤드라인","맑은 고딕",sans-serif;font-weight:900;letter-spacing:-1px}.entry h1{font-size:36px;margin:36px 0 12px}.muted{color:var(--muted);line-height:1.7}.entry .site-choice{margin:25px 0}.entry label{font-size:13px;font-weight:800}.entry select{display:block;width:100%;height:48px;margin-top:8px;padding:0 13px;border:1px solid #bcd0dc;background:#fff}
    .btn{min-height:42px;border:0;border-radius:6px;padding:0 16px;font-weight:800}.primary{background:var(--blue);color:#fff}.soft{background:#e8f3fa;color:var(--navy)}.ghost{background:#fff;border:1px solid #c8d7df;color:var(--navy)}.danger{background:#fff;border:1px solid #ebc1c1;color:#b42d2d}.full{width:100%}
    .shell{min-height:100vh;display:flex}.side{width:276px;flex:none;padding:26px 14px;background:#fff;border-right:1px solid var(--line)}.site-label{display:block;margin:34px 5px 7px;font-size:12px;color:#60798c;font-weight:800}.site-select{width:100%;height:44px;padding:0 11px;border:1px solid #c3d5e0;border-radius:6px;background:#fff;color:var(--navy);font-weight:800}.nav{margin-top:22px;padding-top:15px;border-top:1px solid #edf1f3}.nav button{display:flex;align-items:center;gap:12px;width:100%;height:49px;padding:0 13px;border:0;border-radius:7px;background:none;color:#506779;text-align:left;font-size:16px;font-weight:800}.nav button.active{background:#e7f3fb;color:var(--blue)}.nav .count{margin-left:auto;display:grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:12px;background:#db4853;color:#fff;font-size:11px}
    .main{min-width:0;flex:1}.top{height:82px;padding:0 38px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff}.top small{display:block;color:#668094;font-size:11px}.top b{font-size:15px}.top button{border:0;background:none;color:var(--blue);font-weight:800}.top-actions{display:flex;align-items:center;gap:8px}.top-actions .data-btn{padding:7px 9px;border:1px solid #cbd8df;border-radius:5px;background:#fff;font-size:12px}.content{max-width:1540px;padding:34px 38px}.page-title{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:23px}.page-title h1{margin:5px 0 5px;font-size:31px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.5px;color:var(--blue)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px #1a32440b}.card-pad{padding:22px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:13px}.stat{padding:18px;border-top:3px solid var(--blue)}.stat small{color:var(--muted)}.stat b{display:block;margin-top:12px;font-size:28px}.stat:nth-child(2){border-color:var(--amber)}.stat:nth-child(3){border-color:var(--purple)}.stat:nth-child(4){border-color:var(--green)}.stat:nth-child(5){border-color:var(--teal)}.stat:nth-child(6){border-color:var(--red)}
    .two{display:grid;grid-template-columns:1fr 1.45fr;gap:18px;margin-top:18px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 21px;border-bottom:1px solid var(--line)}.card-head h2{margin:0;font-size:19px}.card-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.reminder{padding:16px 20px;border-bottom:1px solid #edf1f3}.reminder:last-child{border:0}.badge{display:inline-block;padding:5px 8px;border-radius:13px;background:#e7f2fb;color:var(--blue);font-size:11px;font-weight:800}.badge.amber{background:#fff1d7;color:#a46208}.badge.purple{background:#eee8fb;color:#6f43b5}.badge.green{background:#e1f3ec;color:#167559}.badge.red{background:#fde9e9;color:#b63838}.chart{display:flex;align-items:end;gap:16px;min-height:190px;padding:18px 20px}.bar{display:grid;justify-items:center;gap:6px;flex:1;font-size:12px;font-weight:800}.bar i{display:block;width:34px;min-height:8px;border-radius:5px 5px 0 0;background:var(--blue)}.bar small{color:var(--muted);font-weight:700}.process{display:flex;gap:9px;flex-wrap:wrap;padding:17px 20px}.process button{flex:1;min-width:110px;padding:12px;border:1px solid var(--line);background:#fff;color:var(--navy);font-weight:800}.process button b{font-size:18px;color:var(--blue)}
    table{width:100%;min-width:850px;border-collapse:collapse}th{padding:14px;text-align:left;background:#f8fafb;border-bottom:1px solid var(--line);font-size:13px;color:var(--navy)}td{padding:15px 14px;border-bottom:1px solid #edf1f3;font-size:14px}td small{display:block;margin-top:4px;color:var(--muted)}.table-wrap{overflow:auto}.title-link{border:0;padding:0;background:none;color:var(--navy);font-weight:900;font-size:14px;text-align:left}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:14px;padding:18px;margin-bottom:18px}.field{display:block;margin-top:14px;font-size:12px;font-weight:900}.field input,.field select,.field textarea{display:block;width:100%;margin-top:7px;border:1px solid #c8d7df;border-radius:6px;background:#fff;padding:10px}.field input,.field select{height:43px}.field textarea{min-height:92px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.form-grid .wide{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.checkline{display:flex;align-items:center;gap:8px}.checkline input{width:17px;height:17px;accent-color:var(--blue)}
    .step{display:flex;gap:7px;margin:0 0 18px}.step span{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;background:#e6edf2;color:#708191;font-weight:900;font-size:12px}.step span.on{background:var(--blue);color:#fff}.question{padding:24px}.question h2{margin:4px 0;font-size:25px}.answer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}.answer-grid button{min-height:70px;border:1px solid #cfdae1;background:#fff;border-radius:8px;color:var(--ink);font-weight:800;text-align:left;padding:14px}.answer-grid button.selected{border:2px solid var(--blue);background:#eef8ff;color:var(--blue)}.result{padding:30px;background:linear-gradient(120deg,#073d6e,#0578bd);color:#fff}.result.non{background:linear-gradient(120deg,#4d6877,#718794)}.result h1{margin:6px 0;font-size:31px}.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.result-grid div{padding:15px;background:#ffffff16}.result-grid small{opacity:.75}.result-grid b{display:block;margin-top:6px;font-size:22px}.detail{margin-top:18px;padding:22px}.detail h2{margin-top:0;font-size:19px}.detail-item{padding:12px 0;border-bottom:1px solid #edf1f3}.detail-item:last-child{border:0}.detail-item small{color:var(--muted)}
    .modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:18px;background:#0b283d88}.modal-box{width:min(100%,680px);max-height:90vh;overflow:auto;padding:25px;border-radius:10px;background:#fff}.modal-box h2{margin-top:0}.notice{padding:13px 15px;border-left:4px solid var(--amber);background:#fff7e9;color:#72500c;margin-top:15px}.admin-row{display:grid;grid-template-columns:28px 48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:15px 18px;border-bottom:1px solid #edf1f3}.admin-row.head{background:#f8fafb;color:#607485;font-size:12px;font-weight:900}.admin-row strong,.admin-row small{display:block}.admin-row small{margin-top:5px;color:var(--muted);font-size:11px}.mini-actions{display:flex;gap:5px}.mini-actions button{padding:5px 8px;border:1px solid #cbd8df;background:#fff;border-radius:4px;color:var(--blue);font-weight:800}
    @media(max-width:960px){.shell{display:block}.side{width:auto;padding:18px 12px}.side .site-label{margin-top:15px}.nav{display:flex;overflow:auto}.nav button{min-width:135px}.top{padding:0 19px}.content{padding:26px 16px}.cards{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:560px){.entry-card{padding:30px}.entry h1{font-size:29px}.cards,.filters,.form-grid,.answer-grid,.result-grid{grid-template-columns:1fr}.top{height:70px}.top small{display:none}.content{padding:20px 13px}.page-title{flex-direction:column}.page-title h1{font-size:27px}.two{margin-top:14px}.side{padding:14px 10px}.nav button{min-width:125px;font-size:14px}.admin-row{grid-template-columns:25px 32px minmax(0,1fr)}.admin-row .mini-actions{grid-column:3}.process{display:grid;grid-template-columns:1fr 1fr}.filters{padding:14px}.result h1{font-size:25px}}
  </style>
</head>
<body>
  <section id="entry" class="entry"><div class="entry-card"><div class="ci">POSCO<br>퓨처엠<small>SAFECHANGE · PSM MOC ASSISTANT</small></div><h1>변경요소 관리 시스템</h1><p class="muted">사업장을 선택하여 변경요소관리 판단, 이력, 검토·승인 업무를 진행합니다.</p><div class="site-choice"><label>사업장<select id="entrySite"><option>포항라임공장</option><option>포항화성공장</option></select></label></div><button class="btn primary" onclick="enter()">입장 →</button></div></section>
  <div id="app" class="shell hidden"><aside class="side"><div class="ci">POSCO<br>퓨처엠<small>SAFECHANGE · PSM MOC</small></div><label class="site-label">사업장</label><select id="site" class="site-select" onchange="changeSite()"><option>포항라임공장</option><option>포항화성공장</option></select><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><div><small>PSM 변경요소관리</small><b id="topSite"></b></div><div class="top-actions"><button class="data-btn" onclick="dataBackup()">데이터 백업</button><button class="data-btn" onclick="dataRestore()">데이터 복원</button><button onclick="resetEntry()">← 처음 화면으로</button></div></header><div id="content" class="content"></div></main></div>
  <div id="modal" class="modal hidden"><div id="modalBox" class="modal-box"></div></div>
<script>
const KEY='safechange-moc-html-v3', SITES=['포항라임공장','포항화성공장'], TYPES=['기계 설비','배관','전기','계장','운전조건','원료 또는 화학물질','작업 절차','기타'];
const seedQuestions=[['q1','기존 설비 또는 작업과 동일한 규격입니까?','공통',[]],['q2','설비의 용량 또는 성능이 변경됩니까?','설비',['기계 설비']],['q3','사용 재질이 변경됩니까?','설비',['기계 설비','배관']],['q4','운전 온도 또는 압력이 변경됩니까?','공정',['배관','운전조건']],['q5','제어 Logic 또는 Set Point가 변경됩니까?','제어',['전기','계장']],['q6','변경으로 인해 위험도가 증가할 가능성이 있습니까?','위험',[]],['q7','도면 또는 절차서 개정이 필요합니까?','후속조치',[]]];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{cases:[],questions:seedQuestions.map((x,i)=>({id:x[0],order:i+1,text:x[1],category:x[2],types:x[3]})),logs:[]};let site='포항라임공장',view='dashboard',activeId='',draft=null,admin=false,selected=[],selectedQ=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),today=()=>new Date().toISOString().slice(0,10),siteCases=()=>state.cases.filter(x=>x.site===site),active=()=>state.cases.find(x=>x.id===activeId),go=v=>{view=v;render()};
function enter(){site=$('entrySite').value;$('site').value=site;$('entry').classList.add('hidden');$('app').classList.remove('hidden');render()}function resetEntry(){admin=false;draft=null;activeId='';$('app').classList.add('hidden');$('entry').classList.remove('hidden')}function changeSite(){site=$('site').value;activeId='';view='dashboard';render()}function openModal(html){$('modalBox').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
function nav(){let pending=siteCases().filter(x=>x.status==='검토/승인 대기').length, rem=reminders().length;return [['dashboard','⌂','대시보드',''],['new','＋','새 변경 판단',''],['history','▤','작성 이력',''],['reminders','♧','Reminder',rem],['approvals','✓','검토/승인',pending],['admin','⚙','기준 관리','']].map(n=>`<button class="${view===n[0]?'active':''}" onclick="${n[0]==='admin'?'openAdmin()':`go('${n[0]}')`}"><span>${n[1]}</span>${n[2]}${n[3]?`<i class="count">${n[3]}</i>`:''}</button>`).join('')}
function render(){ $('topSite').textContent=site;$('nav').innerHTML=nav();let c=$('content'); if(view==='dashboard')c.innerHTML=dashboard(); if(view==='new')c.innerHTML=newForm(); if(view==='questions')c.innerHTML=questionsPage(); if(view==='result')c.innerHTML=resultPage(); if(view==='history')c.innerHTML=history(); if(view==='reminders')c.innerHTML=remindersPage(); if(view==='approvals')c.innerHTML=approvals(); if(view==='admin')c.innerHTML=adminPage(); if(view==='process')c.innerHTML=processPage(); if(view==='history')renderRows(); if(view==='admin')renderQuestions();}
function dashboard(){let cs=siteCases(), pending=cs.filter(x=>x.status==='검토/승인 대기').length;return `<div class="page-title"><div><span class="eyebrow">SAFECHANGE DASHBOARD</span><h1>변경요소관리 현황</h1><p class="muted">${site}의 변경요소관리 업무를 확인합니다.</p></div><button class="btn primary" onclick="newCase()">＋ 새 변경 판단 시작</button></div><section class="cards">${[['판단 진행 중',cs.filter(x=>x.status==='임시저장').length],['초안 작성 중',cs.filter(x=>x.status==='작성 중').length],['제출 대기',pending],['검토 중',cs.filter(x=>x.status==='검토 중').length],['승인 완료',cs.filter(x=>x.status==='승인 완료').length],['기한 초과',reminders().filter(x=>reason(x)==='기한 초과').length]].map(x=>`<div class="card stat"><small>${x[0]}</small><b>${x[1]}건</b></div>`).join('')}</section><section class="two"><div class="card"><div class="card-head"><div><h2>미완료 Reminder</h2><p>완료 예정일 경과 또는 미제출 건</p></div><span class="badge amber">${reminders().length}건</span></div>${reminders().slice(0,3).map(x=>`<div class="reminder"><b>${esc(x.title)}</b><small class="muted">${reason(x)} · 완료 예정일 ${x.due||'-'}</small></div>`).join('')||'<div class="reminder muted">현재 Reminder 대상이 없습니다.</div>'}<div class="card-pad"><button class="btn soft full" onclick="go('reminders')">Reminder 전체 보기</button></div></div><div class="card"><div class="card-head"><div><h2>최근 작성 목록</h2><p>최근 작업 중인 변경요소관리 건입니다.</p></div><button class="btn ghost" onclick="go('history')">전체 보기 →</button></div><div class="table-wrap"><table><thead><tr><th>작업명</th><th>작업 유형</th><th>MOC 판단</th><th>등급</th><th>상태</th><th></th></tr></thead><tbody>${cs.slice().reverse().slice(0,5).map(row).join('')||'<tr><td colspan="6" class="muted">작성 이력이 없습니다.</td></tr>'}</tbody></table></div></div></section><section class="two"><div class="card"><div class="card-head"><div><h2>작업유형별 변경관리 건수</h2><p>등급 확정 및 비대상 판정 건을 기준으로 표시합니다.</p></div></div>${barChart(TYPES,cs,'workType',['#e86b2c','#ed9d2d','#d9b82a','#39a85a','#2685c7','#4171b7','#8058ae','#7d8790'])}</div><div class="card"><div class="card-head"><div><h2>등급별 변경관리 건수</h2><p>1·2·3등급 및 비대상 현황입니다.</p></div></div>${barChart(['1등급','2등급','3등급','비대상'],cs,'grade',['#d94c4c','#e68d28','#e5be32','#8a949c'])}</div></section>`}
function barChart(labels,cs,key,colors){let nums=labels.map(l=>cs.filter(x=>key==='grade'?x.grade===l:x.workType===l).length),max=Math.max(1,...nums);return `<div class="chart">${labels.map((l,i)=>`<button class="bar" onclick="go('history');setTimeout(()=>filterBy('${key}','${l}'))"><i style="height:${Math.max(8,nums[i]/max*130)}px;background:${colors[i]}"></i><b>${nums[i]}</b><small>${l}</small></button>`).join('')}</div>`}
function row(x){return `<tr><td><button class="title-link" onclick="openDetail('${x.id}')">${esc(x.title)}</button><small>${x.no}</small></td><td>${x.workType}</td><td><span class="badge ${x.target?'red':'green'}">${x.target?'대상':x.grade==='-'?'-':'비대상'}</span></td><td>${x.grade}</td><td><span class="badge">${x.status}</span></td><td><button class="btn soft" onclick="continueCase('${x.id}')">이어서 →</button></td></tr>`}
function newCase(){draft={id:'c-'+Date.now(),site,no:'MOC-'+new Date().getFullYear()+'-'+String(state.cases.length+1).padStart(3,'0'),title:'',workType:'기계 설비',created:today(),due:'',asset:'',reason:'',answers:{},status:'임시저장',grade:'-',target:false};go('new')}
function newForm(){let d=draft||active();if(!d){newCase();return ''}return `<div class="page-title"><div><span class="eyebrow">NEW MOC</span><h1>변경사항을 먼저 알려주세요</h1><p class="muted">입력 내용은 이후 변경 판단과 변경관리 문서에 사용됩니다.</p></div></div><section class="card card-pad"><div class="form-grid"><label class="field wide">변경제목 *<input id="title" value="${esc(d.title)}" placeholder="변경 작업명을 입력하세요"></label><label class="field">작성일자<input value="${d.created}" readonly></label><label class="field">변경완료 예정 *<input id="due" type="date" min="${today()}" value="${d.due}"></label><label class="field">변경 대상 분야<select id="type">${TYPES.map(x=>`<option ${x===d.workType?'selected':''}>${x}</option>`).join('')}</select></label><label class="field">대상 설비 / 공정<input id="asset" value="${esc(d.asset)}" placeholder="예: P-204A 펌프"></label><label class="field wide">변경 사유 *<textarea id="why" placeholder="변경 사유를 입력하세요">${esc(d.reason)}</textarea></label></div><div class="actions"><button class="btn ghost" onclick="temporary('new')">임시저장</button><button class="btn primary" onclick="beginQuestions()">질문 시작 →</button></div></section>`}
function capture(){let d=draft||active();d.title=$('title').value.trim();d.workType=$('type').value;d.due=$('due').value;d.asset=$('asset').value.trim();d.reason=$('why').value.trim();return d}function temporary(from){let d=capture();if(!d.title)return alert('변경제목을 입력해 주세요.');persist(d);openModal(`<h2>임시저장 완료</h2><p>저장을 하고 메인 페이지로 넘어가시겠습니까?</p><div class="actions"><button class="btn ghost" onclick="closeModal()">머무르기</button><button class="btn primary" onclick="closeModal();go('dashboard')">넘어가기</button></div>`)}function beginQuestions(){let d=capture();if(!d.title||!d.due||!d.reason)return alert('변경제목, 변경완료 예정일, 변경 사유를 입력해 주세요.');draft=d;go('questions')}
function applicable(d){return state.questions.filter(q=>!q.types.length||q.types.includes(d.workType)).sort((a,b)=>a.order-b.order)}function questionsPage(){let d=draft||active(),qs=applicable(d),idx=Number(d.qIndex||0),q=qs[idx],a=d.answers[q.id]||'';return `<div class="step">${qs.map((_,i)=>`<span class="${i<=idx?'on':''}">${i+1}</span>`).join('')}</div><section class="card question"><span class="eyebrow">질문 ${idx+1} / ${qs.length}</span><h2>${esc(q.text)}</h2><p class="muted">변경 내용을 기준으로 가장 가까운 답변을 선택해 주세요.</p><div class="answer-grid">${[['YES','예'],['NO','아니오'],['UNKNOWN','잘 모르겠음'],['NA','해당 없음']].map(x=>`<button class="${a===x[0]?'selected':''}" onclick="answer('${q.id}','${x[0]}')">${x[1]}</button>`).join('')}</div>${a==='UNKNOWN'?'<div class="notice">검토 필요로 기록됩니다. 담당자 또는 도면·명판을 통해 확인해 주세요.</div>':''}<div class="actions"><button class="btn ghost" ${idx===0?'disabled':''} onclick="moveQ(-1)">← 이전</button><button class="btn soft" onclick="saveQuestionDraft()">임시저장</button>${idx<qs.length-1?`<button class="btn primary" ${a?'':'disabled'} onclick="moveQ(1)">다음 →</button>`:`<button class="btn primary" ${a?'':'disabled'} onclick="judge()">최종 판단 →</button>`}</div></section>`}
function answer(id,v){let d=draft||active();d.answers[id]=v;render()}function moveQ(n){let d=draft||active();d.qIndex=Math.max(0,Number(d.qIndex||0)+n);render()}function saveQuestionDraft(){let d=draft||active();persist(d);openModal(`<h2>임시저장 완료</h2><p>저장을 하고 메인 페이지로 넘어가시겠습니까?</p><div class="actions"><button class="btn ghost" onclick="closeModal()">머무르기</button><button class="btn primary" onclick="closeModal();go('dashboard')">넘어가기</button></div>`)}
function judge(){let d=draft||active(),v=Object.values(d.answers),unknown=v.includes('UNKNOWN'),yes=q=>d.answers[q]==='YES',none=v.every(x=>x==='NO'||x==='NA');d.target=!none;d.grade=none?'비대상':unknown?'검토 필요':yes('q6')?'2등급':(yes('q3')||yes('q4')||yes('q5'))?'3등급':'3등급';if(yes('q6')&&yes('q4'))d.grade='1등급';d.status=d.grade==='비대상'?'판단 완료':'작성 중';d.target=d.grade!=='비대상';persist(d);activeId=d.id;draft=null;go('result')}
function resultPage(){let d=active();if(!d)return dashboard();let target=d.target;return `<section class="card result ${target?'':'non'}"><span class="eyebrow" style="color:#fff">지침 기준 판정이 완료되었습니다</span><h1>${d.grade==='검토 필요'?'담당자 검토가 필요합니다':target?'변경요소관리 대상으로 판정되었습니다':'변경요소관리 비대상입니다'}</h1><p>${target?'선택 답변을 기준으로 변경관리 절차를 진행합니다.':'기존과 동일한 조건으로 판단되어 비대상 이력으로 저장됩니다.'}</p><div class="result-grid"><div><small>대상 여부</small><b>${target?'대상':'비대상'}</b></div><div><small>변경 등급</small><b>${d.grade}</b></div><div><small>작성 사업장</small><b>${d.site}</b></div></div></section><section class="card detail"><h2>판단 근거</h2>${Object.entries(d.answers).map(([id,v])=>{let q=state.questions.find(x=>x.id===id);return `<div class="detail-item"><b>${esc(q?.text||id)}</b><small>${({YES:'예',NO:'아니오',UNKNOWN:'잘 모르겠음',NA:'해당 없음'})[v]}</small></div>`}).join('')}<div class="actions"><button class="btn ghost" onclick="continueCase('${d.id}')">답변 수정</button>${target?`<button class="btn primary" onclick="go('process')">변경관리 실시계획 →</button>`:'<button class="btn primary" onclick="go(\'history\')">이력 확인 →</button>'}</div></section>`}
function persist(d){let i=state.cases.findIndex(x=>x.id===d.id);if(i<0)state.cases.push(d);else state.cases[i]=d;state.cases=state.cases.map((x,i)=>({...x,no:'MOC-'+new Date().getFullYear()+'-'+String(i+1).padStart(3,'0')}));save();draft=null;activeId=d.id}function continueCase(id){activeId=id;draft=null;let d=active();if(Object.keys(d.answers||{}).length&&d.grade==='-')go('questions');else if(d.grade==='-'||d.status==='임시저장')go('new');else if(d.status==='작성 중')go('process');else go('result')}
function processPage(){let d=active();if(!d)return dashboard();let plan=d.plan||[['공정안전자료','설계도면 및 변경사항 검토','Y',false],['공정위험성평가','위험성 평가 및 필요 조치 검토','Y',false],['안전운전지침','절차서 제정 또는 개정','Y',false],['설비점검 및 유지계획','점검·유지보수 계획 확인','Y',false],['교육훈련','관련 작업자 교육 실시','Y',false]];d.plan=plan;return `<div class="page-title"><div><span class="eyebrow">MOC IMPLEMENTATION PLAN</span><h1>변경관리 실시 계획</h1><p class="muted">Y 항목만 확인 처리할 수 있습니다. 입력 내용은 임시저장 시에만 반영됩니다.</p></div><button class="btn soft" onclick="savePlan()">임시저장</button></div><section class="card"><div class="table-wrap"><table><thead><tr><th>PSM 요소</th><th>세부내용</th><th>Y / N</th><th><input type="checkbox" onchange="toggleAllPlan(this.checked)"> 확인</th></tr></thead><tbody>${plan.map((x,i)=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td><select onchange="planYN(${i},this.value)"><option ${x[2]==='Y'?'selected':''}>Y</option><option ${x[2]!=='Y'?'selected':''}>N</option></select></td><td><input class="planCheck" type="checkbox" ${x[2]!=='Y'?'disabled':''} ${x[3]?'checked':''} onchange="planCheck(${i},this.checked)"></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn primary" onclick="submitReview()">검토 요청 제출 →</button></div></section>`}
function planYN(i,v){active().plan[i][2]=v;if(v!=='Y')active().plan[i][3]=false;render()}function planCheck(i,v){active().plan[i][3]=v}function toggleAllPlan(v){active().plan.forEach(x=>{if(x[2]==='Y')x[3]=v});render()}function savePlan(){persist(active());alert('변경관리 실시 계획을 임시저장했습니다.')}function submitReview(){let d=active();if(!d.plan.filter(x=>x[2]==='Y').every(x=>x[3]))return alert('Y로 선택한 계획 항목을 모두 확인해 주세요.');d.status='검토/승인 대기';persist(d);go('dashboard')}
function history(){return `<div class="page-title"><div><span class="eyebrow">MOC RECORDS</span><h1>작성 이력</h1><p class="muted">${site}의 변경 판단 이력을 확인합니다.</p></div><div class="actions" style="margin:0"><button class="btn danger" onclick="requestDelete()" ${selected.length?'':'disabled'}>이력 삭제</button></div></div><section class="card filters"><label class="field" style="margin:0">통합 검색<input id="search" oninput="renderRows()" placeholder="관리번호, 작업명 검색"></label><label class="field" style="margin:0">기간 시작<input type="date" id="from" oninput="renderRows()"></label><label class="field" style="margin:0">기간 종료<input type="date" id="to" oninput="renderRows()"></label><label class="field" style="margin:0">작업 유형<select id="filterType" onchange="renderRows()"><option>전체</option>${TYPES.map(x=>`<option>${x}</option>`).join('')}</select></label></section><section class="card"><div class="table-wrap"><table><thead><tr><th><input type="checkbox" onchange="allSelect(this.checked)"></th><th>관리번호</th><th>작업명</th><th>작업 유형</th><th>대상 여부</th><th>등급</th><th>작성자 / 부서</th><th>작성일</th><th>상태</th><th>상세</th></tr></thead><tbody id="rows"></tbody></table></div></section><div id="detail"></div>`}
function filtered(){let s=($('search')?.value||'').toLowerCase(),from=$('from')?.value||'',to=$('to')?.value||'',t=$('filterType')?.value||'전체';return siteCases().filter(x=>(!s||(x.no+x.title+x.workType).toLowerCase().includes(s))&&(!from||x.created>=from)&&(!to||x.created<=to)&&(t==='전체'||x.workType===t))}function renderRows(){let rows=filtered(),box=$('rows');if(!box)return;box.innerHTML=rows.length?rows.map(x=>`<tr><td><input type="checkbox" ${selected.includes(x.id)?'checked':''} onchange="toggleSelect('${x.id}')"></td><td><b>${x.no}</b></td><td><button class="title-link" onclick="openDetail('${x.id}')">${esc(x.title)}</button></td><td>${x.workType}</td><td>${x.grade==='-'?'-':x.target?'대상':'비대상'}</td><td>${x.grade}</td><td>${x.site}</td><td>${x.created}</td><td><span class="badge">${x.status}</span></td><td><button class="btn soft" onclick="continueCase('${x.id}')">상세 보기</button></td></tr>`).join(''):'<tr><td colspan="10" class="muted">표시할 이력이 없습니다.</td></tr>'}function filterBy(k,v){if(k==='workType')$('filterType').value=v;renderRows()}function toggleSelect(id){selected=selected.includes(id)?selected.filter(x=>x!==id):[...selected,id];renderRows()}function allSelect(v){let ids=filtered().map(x=>x.id);selected=v?[...new Set([...selected,...ids])]:selected.filter(x=>!ids.includes(x));renderRows()}function requestDelete(){openModal(`<h2>이력 삭제</h2><p>선택한 이력과 연결된 Reminder를 삭제합니다. 관리자 비밀번호를 입력해 주세요.</p><label class="field">비밀번호<input id="pin" type="password"></label><div class="actions"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn danger" onclick="deleteSelected()">삭제</button></div>`)}function deleteSelected(){if($('pin').value!=='0000')return alert('비밀번호가 올바르지 않습니다.');state.cases=state.cases.filter(x=>!selected.includes(x.id));selected=[];save();closeModal();render()}
function openDetail(id){activeId=id;let d=active(),box=$('detail');box.innerHTML=`<section class="card detail"><div class="card-head"><div><h2>MOC REVIEW DETAIL · ${esc(d.title)}</h2><p>${d.no} · ${d.site}</p></div><button class="btn ghost" onclick="$('detail').innerHTML=''">닫기</button></div><div class="card-pad"><b>대상 여부: ${d.grade==='-'?'-':d.target?'대상':'비대상'}　/　등급: ${d.grade}　/　상태: ${d.status}</b><h3>전체 질문과 답변</h3>${Object.keys(d.answers||{}).length?Object.entries(d.answers).map(([id,v])=>`<div class="detail-item">${esc(state.questions.find(q=>q.id===id)?.text||id)}<small>${({YES:'예',NO:'아니오',UNKNOWN:'잘 모르겠음',NA:'해당 없음'})[v]}</small></div>`).join(''):'<p class="muted">아직 판단 전 임시저장 건입니다. 등급·판단 근거·질문 답변은 - 로 표시됩니다.</p>'}<div class="actions"><button class="btn primary" onclick="continueCase('${d.id}')">이어서 작성</button></div></div></section>`;box.scrollIntoView({behavior:'smooth',block:'nearest'})}
function reminders(){return siteCases().filter(x=>x.grade!=='-'&&x.due&&x.status!=='승인 완료'&&x.due<today())}function reason(x){return x.status==='검토/승인 대기'?'미제출':x.status==='작성 중'?'후속 조치':'기한 초과'}function remindersPage(){let list=reminders();return `<div class="page-title"><div><span class="eyebrow">REMINDER CENTER</span><h1>Reminder</h1><p class="muted">완료 예정일을 경과한 미완료 작업을 관리합니다.</p></div><span class="badge amber">${list.length}건</span></div><div class="process"><button onclick="reminderTab('ALL')">전체 <b>${list.length}</b></button><button onclick="reminderTab('기한 초과')">기한 초과</button><button onclick="reminderTab('후속 조치')">후속 조치</button><button onclick="reminderTab('미제출')">미제출</button></div><section class="card" id="reminderRows">${list.map(reminderRow).join('')||'<div class="card-pad muted">Reminder 대상이 없습니다.</div>'}</section>`}function reminderRow(x){return `<div class="reminder"><span class="badge amber">${reason(x)}</span><h3>${esc(x.title)}</h3><p class="muted">현재 단계: ${x.status} · 완료 예정일: ${x.due}</p><div class="actions"><button class="btn ghost" onclick="snooze('${x.id}')">알림 연기</button><button class="btn soft" onclick="alert('개발 환경에서는 메일 발송 로그만 기록합니다.')">메일 로그 생성</button><button class="btn primary" onclick="continueCase('${x.id}')">이어서 작성</button></div></div>`}function reminderTab(tab){let x=reminders().filter(x=>tab==='ALL'||reason(x)===tab);$('reminderRows').innerHTML=x.map(reminderRow).join('')||'<div class="card-pad muted">해당 Reminder가 없습니다.</div>'}function snooze(id){openModal(`<h2>알림 연기</h2><label class="field">알림 재개일<input type="date" id="snooze" min="${today()}"></label><div class="actions"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveSnooze('${id}')">저장</button></div>`)}function saveSnooze(id){let d=state.cases.find(x=>x.id===id);d.due=$('snooze').value;save();closeModal();render()}
function approvals(){let pending=siteCases().filter(x=>x.status==='검토/승인 대기');return `<div class="page-title"><div><span class="eyebrow">REVIEW · APPROVAL</span><h1>검토/승인</h1><p class="muted">등급별 검토·승인자가 제출된 변경 판단 자료를 확인합니다.</p></div><span class="badge purple">${pending.length}건 대기</span></div><section class="card">${pending.map(x=>`<div class="reminder"><span class="badge purple">검토 요청</span><h2>${esc(x.title)}</h2><p class="muted">${x.no} · ${x.workType} · 작성자 ${x.site}</p><div class="actions"><b style="margin-right:auto">검토/승인자: ${x.grade==='3등급'?'설비운영파트장':'변경관리위원회'}</b><button class="btn ghost" onclick="openApprovalDetail('${x.id}')">내용 보기</button><button class="btn primary" onclick="approve('${x.id}')">승인하기</button></div></div>`).join('')||'<div class="card-pad muted">승인 대기 건이 없습니다.</div>'}</section>`}function openApprovalDetail(id){activeId=id;go('history');setTimeout(()=>openDetail(id))}function approve(id){let d=state.cases.find(x=>x.id===id);if((d.grade==='1등급'||d.grade==='2등급')&&!d.committee)return alert('1·2등급은 변경관리위원회 참석자 확인 후 승인할 수 있습니다.');d.status='승인 완료';save();render()} 
function openAdmin(){if(admin){go('admin');return}openModal(`<h2>기준 관리 접근</h2><label class="field">비밀번호<input id="adminPin" type="password"></label><div class="actions"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn primary" onclick="checkAdmin()">입장</button></div>`)}function checkAdmin(){if($('adminPin').value!=='0000')return alert('비밀번호가 올바르지 않습니다.');admin=true;closeModal();go('admin')}function adminPage(){return `<div class="page-title"><div><span class="eyebrow">ADMIN · QUESTION MANAGEMENT</span><h1>기준 관리</h1><p class="muted">질문 변경사항은 저장 즉시 새 변경 판단에 반영됩니다.</p></div><div class="actions" style="margin:0"><button class="btn danger" onclick="deleteQ()" ${selectedQ.length?'':'disabled'}>질문 삭제</button><button class="btn primary" onclick="editQ()">＋ 새 항목</button></div></div><section class="card"><div class="card-pad"><label class="field" style="margin:0">적용 항목<select id="qType" onchange="renderQuestions()"><option>전체</option>${TYPES.map(x=>`<option>${x}</option>`).join('')}</select></label></div><div id="qRows"></div></section>`}function fq(){let t=$('qType')?.value||'전체';return state.questions.filter(q=>t==='전체'||!q.types.length||q.types.includes(t)).sort((a,b)=>a.order-b.order)}function renderQuestions(){let qs=fq();$('qRows').innerHTML=`<div class="admin-row head"><input type="checkbox" onchange="allQ(this.checked)"><span>순서</span><span>질문 / 적용 항목</span><span>관리</span></div>`+qs.map(q=>`<div class="admin-row"><input type="checkbox" ${selectedQ.includes(q.id)?'checked':''} onchange="toggleQ('${q.id}')"><b>${q.order}</b><div><strong>${esc(q.text)}</strong><small>${q.category} · ${q.types.join(', ')||'공통'}</small></div><div class="mini-actions"><button onclick="moveQAdmin('${q.id}',-1)">↑</button><button onclick="moveQAdmin('${q.id}',1)">↓</button><button onclick="editQ('${q.id}')">편집</button></div></div>`).join('')}function toggleQ(id){selectedQ=selectedQ.includes(id)?selectedQ.filter(x=>x!==id):[...selectedQ,id];renderQuestions()}function allQ(v){let ids=fq().map(q=>q.id);selectedQ=v?[...new Set([...selectedQ,...ids])]:selectedQ.filter(x=>!ids.includes(x));renderQuestions()}function moveQAdmin(id,n){let i=state.questions.findIndex(q=>q.id===id),j=i+n;if(j<0||j>=state.questions.length)return;[state.questions[i],state.questions[j]]=[state.questions[j],state.questions[i]];state.questions.forEach((q,i)=>q.order=i+1);save();renderQuestions()}function deleteQ(){if(!confirm('선택한 질문을 삭제할까요?'))return;state.questions=state.questions.filter(q=>!selectedQ.includes(q.id));state.questions.forEach((q,i)=>q.order=i+1);selectedQ=[];save();renderQuestions()}function editQ(id){let q=state.questions.find(x=>x.id===id)||{id:'q'+Date.now(),order:state.questions.length+1,text:'',category:'공통',types:[]};openModal(`<h2>${id?'질문 편집':'새 질문'}</h2><label class="field">질문<input id="qt" value="${esc(q.text)}"></label><label class="field">분류<input id="qc" value="${esc(q.category)}"></label><label class="field">적용 항목</label><div>${TYPES.map(t=>`<label class="checkline"><input class="qcheck" type="checkbox" value="${t}" ${q.types.includes(t)?'checked':''}>${t}</label>`).join('')}</div><div class="actions"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveQ('${q.id}')">저장</button></div>`)}function saveQ(id){let text=$('qt').value.trim();if(!text)return alert('질문을 입력해 주세요.');let q={id,order:state.questions.find(x=>x.id===id)?.order||state.questions.length+1,text,category:$('qc').value||'공통',types:[...document.querySelectorAll('.qcheck:checked')].map(x=>x.value)};let i=state.questions.findIndex(x=>x.id===id);if(i<0)state.questions.push(q);else state.questions[i]=q;save();closeModal();renderQuestions()}
function dataBackup(){const backup={format:'SafeChange-MOC-Offline-Backup',version:1,exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`SafeChange_MOC_백업_${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);}
function dataRestore(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=event=>{const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const backup=JSON.parse(String(reader.result));if(backup.format!=='SafeChange-MOC-Offline-Backup'||!backup.state?.cases||!backup.state?.questions)throw new Error('invalid');if(!confirm(`백업 시점: ${new Date(backup.exportedAt).toLocaleString('ko-KR')}\n현재 이력과 질문 기준을 백업 파일 내용으로 교체할까요?`))return;state=backup.state;selected=[];selectedQ=[];draft=null;activeId='';save();render();alert('데이터 복원이 완료되었습니다.')}catch{alert('SafeChange에서 생성한 올바른 백업 JSON 파일을 선택해 주세요.')}};reader.readAsText(file,'utf-8')};input.click()}
</script></body></html>
