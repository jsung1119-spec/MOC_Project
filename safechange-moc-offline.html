<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SafeChange PSM 변경요소관리 · 오프라인</title>
  <style>
    :root{--navy:#102a43;--blue:#1769aa;--soft:#eaf4fb;--line:#dce4ea;--canvas:#f3f6f8;--muted:#687888;--red:#c84545;--green:#238267;--font:"NIXGONM-Vb","닉스곤체 2.0","맑은 고딕",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:#172434;font-family:var(--font)}button,input,select,textarea{font:inherit}button{cursor:pointer}.entry{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#102a43,#1769aa)}.entry-card{width:min(100%,550px);padding:48px;border-radius:14px;background:#fff;box-shadow:0 25px 70px #081d3270}.logo{font-weight:900;font-size:31px;color:#075691;letter-spacing:-1.5px}.logo small{display:block;margin-top:6px;font-size:11px;letter-spacing:2px;color:#6e8494}.entry h1{font-size:34px;margin:38px 0 12px;color:var(--navy)}p{line-height:1.75}.entry p,.muted{color:var(--muted)}.btn{min-height:42px;border:0;border-radius:6px;padding:0 16px;font-weight:800}.primary{background:var(--blue);color:#fff}.ghost{border:1px solid #cbd8df;background:#fff;color:var(--navy)}.danger{border:1px solid #efc1c1;background:#fff;color:#b53232}.shell{display:flex;min-height:100vh}.side{width:250px;background:#fff;border-right:1px solid var(--line);padding:25px 14px}.site-label{display:block;margin:35px 4px 7px;font-size:12px;font-weight:800;color:#60798c}.site-select{width:100%;height:42px;border:1px solid #cbd8df;border-radius:6px;padding:0 10px;color:var(--navy);font-weight:800;background:#fff}.nav{margin-top:24px;border-top:1px solid #edf1f3;padding-top:14px}.nav button{display:block;width:100%;height:47px;padding:0 13px;border:0;border-radius:6px;background:none;color:#506779;text-align:left;font-size:15px;font-weight:800}.nav button.active{background:var(--soft);color:var(--blue)}.main{flex:1;min-width:0}.top{height:82px;padding:0 38px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line)}.top b{font-size:17px}.top button{border:0;background:none;color:var(--blue);font-weight:800}.content{padding:36px 40px;max-width:1500px}.page-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.eyebrow{font-size:12px;color:var(--blue);font-weight:900;letter-spacing:1.5px}.page-head h1{margin:8px 0;font-size:30px}.card{background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 2px 8px #1a324408}.dashboard-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{padding:21px;border-top:3px solid var(--blue)}.stat small{color:var(--muted)}.stat b{display:block;margin-top:13px;font-size:29px}.filter{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:14px;padding:18px;margin-bottom:18px}.filter label,.question-filter label{font-size:12px;font-weight:900;color:var(--navy)}.filter input,.filter select,.question-filter select{display:block;width:100%;height:40px;margin-top:7px;padding:0 10px;border:1px solid #cbd8df;border-radius:6px;background:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th{padding:13px;text-align:left;background:#f8fafb;border-bottom:1px solid var(--line);font-size:12px;color:var(--navy)}td{padding:14px 13px;border-bottom:1px solid #edf1f3;font-size:13px}td small{display:block;color:var(--muted);margin-top:4px}input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue)}.row-actions{display:flex;gap:9px}.admin-bar{display:flex;gap:10px;align-items:center;padding:18px;border-bottom:1px solid var(--line)}.question-filter{display:flex;align-items:end;gap:18px;flex:1}.question-filter label{min-width:230px}.question-filter span{font-size:12px;color:var(--muted)}.question-row{display:grid;grid-template-columns:28px 45px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid #edf1f3}.question-row.head{background:#f8fafb;font-size:12px;font-weight:900;color:#607485}.question-row strong,.question-row small{display:block}.question-row small{margin-top:5px;color:var(--muted);font-size:11px}.order-actions{display:flex;gap:5px}.order-actions button{border:1px solid #cbd8df;background:#fff;border-radius:4px;padding:5px 8px;color:var(--blue);font-weight:800}.badge{display:inline-block;border-radius:15px;padding:5px 8px;background:#e7f2fb;color:var(--blue);font-size:11px;font-weight:800}.empty{padding:60px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:#102a4366}.modal .box{width:min(100%,650px);padding:24px;background:#fff;border-radius:10px}.modal h2{margin-top:0}.field{display:block;margin-top:13px;font-size:12px;font-weight:800}.field input,.field textarea{display:block;width:100%;margin-top:6px;border:1px solid #cbd8df;border-radius:6px;padding:10px}.field textarea{min-height:75px}.checks{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px}.checks label{font-size:12px;font-weight:700}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.hidden{display:none!important}@media(max-width:850px){.shell{display:block}.side{width:auto}.nav{display:flex;overflow:auto}.nav button{min-width:120px}.content{padding:24px 15px}.top{padding:0 18px}.dashboard-grid{grid-template-columns:1fr 1fr}.filter{grid-template-columns:1fr 1fr}.admin-bar{align-items:stretch;flex-direction:column}.question-filter{align-items:stretch}.page-head{flex-direction:column}}@media(max-width:520px){.dashboard-grid,.filter{grid-template-columns:1fr}.question-row{grid-template-columns:24px 30px minmax(0,1fr)}.question-row .order-actions{grid-column:3}.question-row.head span:last-child{display:none}}
  </style>
</head>
<body>
  <section id="entry" class="entry"><div class="entry-card"><div class="logo">POSCO<br>퓨처엠<small>SAFECHANGE · PSM MOC</small></div><h1>변경요소 관리 시스템</h1><p>인터넷 연결 없이도 사업장별 변경 판단 이력과 질문 기준을 관리할 수 있습니다.</p><button class="btn primary" onclick="enterApp()">입장 →</button></div></section>
  <div id="app" class="shell hidden"><aside class="side"><div class="logo">POSCO<br>퓨처엠<small>SAFECHANGE</small></div><label class="site-label">사업장</label><select id="site" class="site-select" onchange="render()"><option>포항라임공장</option><option>포항화성공장</option></select><nav class="nav"><button class="active" data-view="dashboard" onclick="view('dashboard')">⌂　대시보드</button><button data-view="new" onclick="view('new')">＋　새 변경 판단</button><button data-view="history" onclick="view('history')">▤　작성 이력</button><button data-view="admin" onclick="openAdmin()">⚙　기준 관리</button></nav></aside><main class="main"><header class="top"><b id="site-title">포항라임공장</b><button onclick="exitApp()">← 처음 화면으로</button></header><div id="content" class="content"></div></main></div>
  <div id="modal" class="modal hidden"><div class="box" id="modal-box"></div></div>
  <script>
    const KEY='safechange-offline-v1', SITES=['포항라임공장','포항화성공장'], TYPES=['기계 설비','배관','전기','계장','운전조건','원료 또는 화학물질','작업 절차','기타'];
    const defaults=[['same_spec','기존 설비와 동일한 규격입니까?','공통',[]],['capacity','설비의 용량 또는 성능이 변경됩니까?','설비',['기계 설비']],['material','사용 재질이 변경됩니까?','설비',['기계 설비','배관']],['operating','운전 온도 또는 압력이 변경됩니까?','공정',['배관','운전조건']],['logic','제어 Logic 또는 Set Point가 변경됩니까?','제어',['계장','전기']],['hazard','변경으로 인해 위험도가 증가할 가능성이 있습니까?','위험',[]],['revision','작업 완료 후 도면 또는 절차서 개정이 필요합니까?','후속조치',[]]];
    let state=JSON.parse(localStorage.getItem(KEY)||'null')||{questions:defaults.map((q,i)=>({id:q[0],order:i+1,text:q[1],category:q[2],workTypes:q[3],description:'변경 내용을 확인한 뒤 선택해 주세요.'})),cases:[]};let current='dashboard',admin=false,selectedCases=[],selectedQuestions=[];
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const site=()=>document.getElementById('site').value;const localCases=()=>state.cases.filter(x=>x.site===site());
    function enterApp(){document.getElementById('entry').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}function exitApp(){admin=false;document.getElementById('app').classList.add('hidden');document.getElementById('entry').classList.remove('hidden')}function view(v){current=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}function openAdmin(){if(admin){view('admin');return}showModal('<h2>기준관리 접근</h2><p>비밀번호를 입력해 주세요.</p><label class="field">비밀번호<input id="pin" type="password" autofocus></label><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn primary" onclick="checkPin()">입장</button></div>')}function checkPin(){if(document.getElementById('pin').value==='0000'){admin=true;closeModal();view('admin')}else alert('비밀번호가 올바르지 않습니다.')}function showModal(html){document.getElementById('modal-box').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
    function render(){document.getElementById('site-title').textContent=site();let c=document.getElementById('content');if(current==='dashboard')c.innerHTML=dashboard();if(current==='history')c.innerHTML=history();if(current==='new')c.innerHTML=newCase();if(current==='admin')c.innerHTML=adminPage()}
    function dashboard(){let cases=localCases();return `<div class="page-head"><div><span class="eyebrow">SAFECHANGE DASHBOARD</span><h1>안녕하세요, 변경요소 관리 시스템입니다.</h1><p class="muted">선택한 사업장의 변경요소관리 현황입니다.</p></div><button class="btn primary" onclick="view('new')">＋ 새 변경 판단 시작</button></div><div class="dashboard-grid"><div class="card stat"><small>판단 진행 중</small><b>${cases.filter(x=>x.status==='진행 중').length}건</b></div><div class="card stat"><small>승인 완료</small><b>${cases.filter(x=>x.status==='승인 완료').length}건</b></div><div class="card stat"><small>전체 이력</small><b>${cases.length}건</b></div></div><div class="card" style="margin-top:18px"><div class="admin-bar"><b>최근 작성 목록</b><button class="btn ghost" onclick="view('history')">전체 보기</button></div>${cases.length?'<div class="table-wrap"><table><thead><tr><th>관리번호</th><th>작업명</th><th>작업 유형</th><th>상태</th><th>작성일</th></tr></thead><tbody>'+cases.slice(-5).reverse().map(x=>`<tr><td><b>${esc(x.no)}</b></td><td>${esc(x.title)}</td><td>${esc(x.type)}</td><td><span class="badge">${esc(x.status)}</span></td><td>${x.date}</td></tr>`).join('')+'</tbody></table></div>':'<div class="empty">작성된 이력이 없습니다. 새 변경 판단을 시작해 주세요.</div>'}</div>`}
    function newCase(){return `<div class="page-head"><div><span class="eyebrow">NEW MOC</span><h1>새 변경 판단</h1><p class="muted">변경하려는 항목을 선택하면 해당 질문이 표시됩니다.</p></div></div><div class="card" style="padding:24px"><label class="field">작업명<input id="caseTitle" placeholder="예: P-204A 메카니컬 씰 교체"></label><label class="field">변경 항목<select id="caseType">${TYPES.map(x=>`<option>${x}</option>`).join('')}</select></label><div class="modal-actions"><button class="btn primary" onclick="startCase()">질문 시작</button></div></div>`}
    function startCase(){let title=document.getElementById('caseTitle').value.trim(),type=document.getElementById('caseType').value;if(!title)return alert('작업명을 입력해 주세요.');let qs=state.questions.filter(q=>!q.workTypes.length||q.workTypes.includes(type));showModal(`<h2>${esc(type)} 변경 판단</h2><p>질문에 답한 뒤 이력으로 저장합니다.</p><div id="answers">${qs.map(q=>`<label class="field">${esc(q.text)}<select data-q="${q.id}"><option value="예">예</option><option value="아니오">아니오</option><option value="잘 모르겠음">잘 모르겠음</option><option value="해당 없음">해당 없음</option></select></label>`).join('')}</div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveCase('${esc(title)}','${esc(type)}')">판단 완료</button></div>`)}
    function saveCase(title,type){let yes=[...document.querySelectorAll('[data-q]')].filter(x=>x.value==='예').length;state.cases.push({id:Date.now().toString(),site:site(),no:'MOC-'+new Date().getFullYear()+'-'+String(state.cases.length+1).padStart(3,'0'),title,type,status:yes?'검토/승인 대기':'판단 완료',date:new Date().toISOString().slice(0,10)});save();closeModal();view('history')}
    function history(){let cases=localCases();return `<div class="page-head"><div><span class="eyebrow">MOC RECORDS</span><h1>작성 이력</h1><p class="muted">사업장별 변경 판단 이력을 확인합니다.</p></div><div class="row-actions"><button class="btn danger" onclick="deleteCases()" ${selectedCases.length?'':'disabled'}>이력 삭제</button></div></div><div class="card filter"><label>통합 검색<input id="historySearch" oninput="renderHistoryTable()" placeholder="관리번호, 작업명 검색"></label><label>작성 기간 시작<input type="date" id="from" oninput="renderHistoryTable()"></label><label>작성 기간 종료<input type="date" id="to" oninput="renderHistoryTable()"></label><label>작업 유형<select id="typeFilter" onchange="renderHistoryTable()"><option>전체</option>${TYPES.map(x=>`<option>${x}</option>`).join('')}</select></label></div><div class="card"><div class="table-wrap"><table><thead><tr><th><input type="checkbox" aria-label="현재 목록 전체 선택" onchange="selectAllCases(this.checked)"></th><th>관리번호</th><th>작업명</th><th>작업 유형</th><th>상태</th><th>작성일</th></tr></thead><tbody id="historyRows"></tbody></table></div></div>`}
    function historyFiltered(){let search=(document.getElementById('historySearch')?.value||'').toLowerCase(),from=document.getElementById('from')?.value||'',to=document.getElementById('to')?.value||'',type=document.getElementById('typeFilter')?.value||'전체';return localCases().filter(x=>(!search||(x.no+x.title+x.type).toLowerCase().includes(search))&&(!from||x.date>=from)&&(!to||x.date<=to)&&(type==='전체'||x.type===type))}function renderHistoryTable(){let rows=historyFiltered();document.getElementById('historyRows').innerHTML=rows.length?rows.map(x=>`<tr><td><input type="checkbox" ${selectedCases.includes(x.id)?'checked':''} onchange="toggleCase('${x.id}')"></td><td><b>${x.no}</b></td><td>${esc(x.title)}</td><td>${esc(x.type)}</td><td><span class="badge">${x.status}</span></td><td>${x.date}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">표시할 이력이 없습니다.</td></tr>'}function toggleCase(id){selectedCases=selectedCases.includes(id)?selectedCases.filter(x=>x!==id):[...selectedCases,id];render()}function selectAllCases(checked){let ids=historyFiltered().map(x=>x.id);selectedCases=checked?[...new Set([...selectedCases,...ids])]:selectedCases.filter(x=>!ids.includes(x));render()}function deleteCases(){if(!selectedCases.length)return;if(!confirm('선택한 이력과 연결된 알림 기록을 삭제할까요?'))return;state.cases=state.cases.filter(x=>!selectedCases.includes(x.id));selectedCases=[];save();render()}
    function adminPage(){let options=['전체',...TYPES];return `<div class="page-head"><div><span class="eyebrow">ADMIN · QUESTION MANAGEMENT</span><h1>기준 관리</h1><p class="muted">질문 변경 사항은 저장 즉시 새 변경 판단에 반영됩니다.</p></div><div class="row-actions"><button class="btn danger" onclick="deleteQuestions()" ${selectedQuestions.length?'':'disabled'}>질문 삭제</button><button class="btn primary" onclick="editQuestion()">＋ 새 항목</button></div></div><div class="card"><div class="admin-bar"><div class="question-filter"><label>적용 항목<select id="questionFilter" onchange="renderQuestionRows()">${options.map(x=>`<option>${x}</option>`).join('')}</select></label><span id="questionCount"></span></div></div><div id="questionRows"></div></div>`}
    function filteredQuestions(){let type=document.getElementById('questionFilter')?.value||'전체';return state.questions.filter(q=>type==='전체'||!q.workTypes.length||q.workTypes.includes(type))}function renderQuestionRows(){let qs=filteredQuestions(),list=document.getElementById('questionRows');if(!list)return;document.getElementById('questionCount').textContent=`${qs.length}개 질문`;list.innerHTML=`<div class="question-row head"><input type="checkbox" aria-label="표시된 질문 전체 선택" onchange="selectAllQuestions(this.checked)"><span>순서</span><span>질문 / 적용 항목</span><span>관리</span></div>`+qs.map(q=>`<div class="question-row"><input type="checkbox" ${selectedQuestions.includes(q.id)?'checked':''} onchange="toggleQuestion('${q.id}')"><b>${q.order}</b><div><strong>${esc(q.text)}</strong><small>${esc(q.category)} · ${q.workTypes.length?esc(q.workTypes.join(', ')):'공통'} </small></div><div class="order-actions"><button onclick="moveQuestion('${q.id}',-1)">↑</button><button onclick="moveQuestion('${q.id}',1)">↓</button><button onclick="editQuestion('${q.id}')">편집</button></div></div>`).join('')}function toggleQuestion(id){selectedQuestions=selectedQuestions.includes(id)?selectedQuestions.filter(x=>x!==id):[...selectedQuestions,id];renderQuestionRows()}function selectAllQuestions(checked){let ids=filteredQuestions().map(q=>q.id);selectedQuestions=checked?[...new Set([...selectedQuestions,...ids])]:selectedQuestions.filter(x=>!ids.includes(x));renderQuestionRows()}function deleteQuestions(){if(!selectedQuestions.length)return;if(!confirm('선택한 질문을 삭제할까요?'))return;state.questions=state.questions.filter(q=>!selectedQuestions.includes(q.id)).map((q,i)=>({...q,order:i+1}));selectedQuestions=[];save();renderQuestionRows()}function moveQuestion(id,dir){let i=state.questions.findIndex(q=>q.id===id),j=i+dir;if(j<0||j>=state.questions.length)return;[state.questions[i],state.questions[j]]=[state.questions[j],state.questions[i]];state.questions=state.questions.map((q,i)=>({...q,order:i+1}));save();renderQuestionRows()}
    function editQuestion(id){let q=id?state.questions.find(x=>x.id===id):{id:'q-'+Date.now(),order:state.questions.length+1,text:'',category:'공통',workTypes:[],description:''};showModal(`<h2>${id?'질문 편집':'새 질문'}</h2><label class="field">질문<input id="qText" value="${esc(q.text)}"></label><label class="field">분류<input id="qCategory" value="${esc(q.category)}"></label><label class="field">보충 설명<textarea id="qDesc">${esc(q.description)}</textarea></label><label class="field">적용 항목</label><div class="checks">${TYPES.map(t=>`<label><input type="checkbox" value="${t}" ${q.workTypes.includes(t)?'checked':''}> ${t}</label>`).join('')}</div><div class="modal-actions"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveQuestion('${q.id}')">저장</button></div>`)}function saveQuestion(id){let text=document.getElementById('qText').value.trim();if(!text)return alert('질문을 입력해 주세요.');let q={id,order:state.questions.find(x=>x.id===id)?.order||state.questions.length+1,text,category:document.getElementById('qCategory').value.trim()||'공통',description:document.getElementById('qDesc').value.trim(),workTypes:[...document.querySelectorAll('.checks input:checked')].map(x=>x.value)};let i=state.questions.findIndex(x=>x.id===id);if(i<0)state.questions.push(q);else state.questions[i]=q;save();closeModal();renderQuestionRows()}
    document.getElementById('site').addEventListener('change',render);document.addEventListener('DOMContentLoaded',()=>{});const originalRender=render;render=function(){originalRender();if(current==='history')renderHistoryTable();if(current==='admin')renderQuestionRows()};
  </script>
</body>
</html>
