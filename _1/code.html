<!DOCTYPE html>

<html class="light" lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PSM AI Assistant - 로그인</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                      "surface-bright": "#f8f9fa",
                      "primary-container": "#1b2b4e",
                      "outline-variant": "#c5c6cf",
                      "on-primary-fixed-variant": "#37466b",
                      "on-background": "#191c1d",
                      "on-tertiary-fixed": "#2c1600",
                      "on-error-container": "#93000a",
                      "tertiary-fixed-dim": "#ffb86f",
                      "on-primary-fixed": "#081a3d",
                      "primary-fixed": "#d9e2ff",
                      "on-error": "#ffffff",
                      "on-secondary-container": "#e4e7ff",
                      "surface-container-highest": "#e1e3e4",
                      "on-tertiary-container": "#d57f00",
                      "surface-container": "#edeeef",
                      "on-surface-variant": "#45464e",
                      "tertiary-container": "#432500",
                      "on-secondary": "#ffffff",
                      "background": "#f8f9fa",
                      "primary-fixed-dim": "#b6c6f1",
                      "surface-variant": "#e1e3e4",
                      "error": "#ba1a1a",
                      "outline": "#75777f",
                      "surface-dim": "#d9dadb",
                      "error-container": "#ffdad6",
                      "inverse-surface": "#2e3132",
                      "primary": "#041638",
                      "on-surface": "#191c1d",
                      "inverse-primary": "#b6c6f1",
                      "secondary-container": "#0356ff",
                      "surface-container-low": "#f3f4f5",
                      "on-tertiary-fixed-variant": "#693c00",
                      "tertiary": "#271300",
                      "surface": "#f8f9fa",
                      "secondary-fixed-dim": "#b6c4ff",
                      "surface-tint": "#4e5e84",
                      "tertiary-fixed": "#ffdcbd",
                      "on-tertiary": "#ffffff",
                      "on-secondary-fixed": "#001551",
                      "on-primary": "#ffffff",
                      "secondary-fixed": "#dce1ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "margin-mobile": "16px",
                      "unit-6": "24px",
                      "unit-3": "12px",
                      "unit-12": "48px",
                      "touch-target": "48px",
                      "unit-4": "16px",
                      "base": "4px",
                      "unit-16": "64px",
                      "gutter": "24px",
                      "unit-8": "32px",
                      "unit-2": "8px",
                      "margin-desktop": "32px",
                      "unit-1": "4px"
              },
              "fontFamily": {
                      "headline-xl": ["Inter"],
                      "label-sm": ["Inter"],
                      "body-lg": ["Inter"],

                      "body-md": ["Inter"],

                      "body-sm": ["Inter"],
                      "label-md": ["Inter"],
                      "headline-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"]

              "fontSize": {
                      "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],

                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}]
              }
            },
          },
        }
      </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        .login-card {
            border-left: 4px solid #0041c9;
        }
        .bg-mesh {
            background-color: #f8f9fa;
            background-image: radial-gradient(at 0% 0%, hsla(220,100%,95%,1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(210,100%,98%,1) 0, transparent 50%), 
                              radial-gradient(at 100% 0%, hsla(200,100%,95%,1) 0, transparent 50%);
        }
        .input-focus-ring:focus-within {
            border-width: 2px;
            border-color: #0041c9;
        }
    </style>
</head>
<body class="bg-mesh font-body-md text-on-surface min-h-screen flex items-center justify-center p-unit-4">
<main class="w-full max-w-[440px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Logo & Product Identity -->
<div class="text-center mb-unit-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-xl bg-primary mb-unit-4 shadow-sm">
<span class="material-symbols-outlined text-white text-[32px]" data-icon="security" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">PSM AI Assistant</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-unit-1">Safety Management Portal</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-unit-8 shadow-sm login-card">
<div class="mb-unit-6">
<h2 class="font-headline-sm text-headline-sm text-on-surface">로그인</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">안전 관리자용 전용 로그인</p>
</div>
<form action="#" class="space-y-unit-4" method="POST" onsubmit="return false;">
<!-- ID Input -->
<div class="space-y-unit-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="employee-id">사번</label>
<div class="relative flex items-center border border-outline rounded-lg bg-surface transition-all input-focus-ring">
<span class="material-symbols-outlined absolute left-3 text-outline" data-icon="badge">badge</span>
<input class="w-full h-touch-target pl-10 pr-unit-4 bg-transparent border-none focus:ring-0 font-body-md text-on-surface placeholder:text-outline/50" id="employee-id" name="id" placeholder="예: SF-8829" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-unit-1">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">보안 키</label>
<a class="font-label-md text-label-md text-secondary hover:underline transition-all" href="#">비밀번호 찾기</a>
</div>
<div class="relative flex items-center border border-outline rounded-lg bg-surface transition-all input-focus-ring">
<span class="material-symbols-outlined absolute left-3 text-outline" data-icon="lock">lock</span>
<input class="w-full h-touch-target pl-10 pr-unit-12 bg-transparent border-none focus:ring-0 font-body-md text-on-surface placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Terms & Session -->
<div class="flex items-center py-unit-2">
<input class="w-5 h-5 rounded border-outline text-secondary focus:ring-secondary cursor-pointer" id="remember" type="checkbox"/>
<label class="ml-unit-2 font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">이 기기를 12시간 동안 기억하기</label>
</div>
<!-- Action Button -->
<button class="w-full h-touch-target bg-secondary text-on-secondary font-headline-sm text-headline-sm rounded-lg hover:bg-secondary-container active:scale-[0.98] transition-all flex items-center justify-center gap-unit-2 shadow-sm" type="submit">
<span>보안 로그인</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="mt-unit-8 pt-unit-6 border-t border-outline-variant flex flex-col gap-unit-3">
<button class="w-full h-touch-target flex items-center justify-center gap-unit-2 border border-outline rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined" data-icon="fingerprint">fingerprint</span>
<span>생체 인식 인증</span>
</button>
</div>
</div>
<!-- Footer Info -->
<div class="mt-unit-8 flex items-center justify-between px-unit-2">
<div class="flex items-center gap-unit-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]" data-icon="gpp_good">gpp_good</span>
<span class="font-label-md text-label-md">FIPS 140-2 보안 표준 준수</span>
</div>
<div class="flex gap-unit-4">
<a class="font-label-md text-label-md text-outline hover:text-on-surface transition-colors" href="#">법적 고지</a>
<a class="font-label-md text-label-md text-outline hover:text-on-surface transition-colors" href="#">개인정보 처리방침</a>
</div>
</div>
<!-- Atmospheric Visual Component -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-surface-container-highest overflow-hidden">
<div class="h-full bg-secondary w-1/3 animate-[loading_3s_infinite_linear]"></div>
</div>
</main>
<!-- Side decoration - Subtle Technical Detail -->
<div class="fixed right-unit-8 top-1/2 -translate-y-1/2 hidden lg:block pointer-events-none opacity-20">
<div class="w-[300px] h-[600px] bg-contain bg-no-repeat bg-center" data-alt="A clean, minimalist technical diagram of industrial safety infrastructure, featuring architectural lines, blue tones, and high-tech digital elements." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCy1jDKzwGiHx4Mo_td6ioGRWFEHiiH2UeeP7pyXikqk2HcYF-tP82imctGHLW27Xn-EjpIrhW0hYiHTE76mIQo8_2ATlSEB8_5I2DzVb1upcSJOfTVkHKdOegtfdmAxav1FpyGUCNH2gYzVh2skJhj--58skzHbims4R6FXzgE7t4aErxWu8B-wj-_Zv6eTlhHSQvSgxP6VnzAK2qc0afRPBhvu42-GDch1A_0_G_FBduhfWAvP6CM9Q')"></div>
</div>
<script>
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                eyeIcon.textContent = 'visibility';
            }
        }

        // Add a simple interaction for the login button
        document.querySelector('form').addEventListener('submit', function(e) {
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> 인증 중...';
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 2000);
        });
    </script>
<style>
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }
    </style>
</body></html>
